name: convert

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v6

      - name: 克隆
        env:
          REPO_B64: aHR0cHM6Ly9naXRsYWIuY29tL2ZyZWU5OTk5L2lwdXBkYXRlLmdpdA==
        run: |
          REPO_URL=$(echo "$REPO_B64" | base64 -d)

          git clone --depth=1 --filter=blob:none --sparse \
            "$REPO_URL" ipupdate

          cd ipupdate

          git sparse-checkout set backup/img/1/2/ip

      - name: 转换全部配置文件
        run: |
          # ============================================================
          # 写入统一转换脚本
          # ============================================================
          echo '' | base64 -d > /tmp/convert.py

          pip install pyyaml -q

          OUTPUT_FILE="links.txt"
          > "$OUTPUT_FILE"

          INDEX=1

          # ============================================================
          # 自动寻找 config.json / config.yaml
          # ============================================================
          find ipupdate/backup/img/1/2/ip \
            \( -name "config.json" -o -name "config.yaml" -o -name "client.yaml" \) \
            | sort \
            > /tmp/config_list.txt

          echo "发现配置文件："
          cat /tmp/config_list.txt

          echo ""

          # ============================================================
          # 逐个处理
          # ============================================================
          while read -r CFG_FILE; do
            echo "===== 处理配置 #${INDEX} ====="
            echo "文件: $CFG_FILE"

            LINK=$(python3 /tmp/convert.py "$CFG_FILE" 2>&1)

            if [ $? -ne 0 ]; then
              echo "::warning::配置 #${INDEX}: 转换失败 - $LINK"
            else
              echo "$LINK" >> "$OUTPUT_FILE"
            fi

            INDEX=$((INDEX + 1))

          done < /tmp/config_list.txt

          echo ""
          echo "===== Base64 编码 ====="

          FULL_B64=$(cat "$OUTPUT_FILE" | base64 -w 0)
          echo "$FULL_B64" > "$OUTPUT_FILE"

      - name: 推送到仓库
        run: |
          git add links.txt

          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "chore: 更新链接 [$(date -u '+%Y-%m-%d %H:%M')]"

            git push
          fi
